name: HelpDesk autotests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Unit and integration tests
        run: npm test

      - name: Start test server
        run: |
          nohup npm run start:test > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo "Server is up"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health || (echo "Server log:"; cat server.log; exit 1)

      - name: Run Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://127.0.0.1:3000/api/health'
          wait-on-timeout: 30
          browser: electron

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore