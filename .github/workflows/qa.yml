name: HelpDesk autotests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Unit and integration tests
        run: npm test

      - name: Start test server
        run: |
          # Запускаем сервер в фоне и сохраняем его PID
          nohup npm run start:test > server.log 2>&1 &
          echo $! > server.pid

          # Ждём до 30 секунд, пока сервер ответит
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo "✅ Сервер готов"
              break
            fi
            echo "⏳ Ожидание сервера... ($i)"
            sleep 1
          done

          # Финальная проверка: если сервер не поднялся, показываем его лог и падаем
          curl -fsS http://127.0.0.1:3000/api/health || (echo "❌ Сервер не ответил. Лог:"; cat server.log; exit 1)

      - name: Run Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          # Сервер уже запущен предыдущим шагом, поэтому start не нужен.
          # wait-on оставляем для подстраховки, но теперь он будет ждать уже готовый сервер.
          wait-on: 'http://127.0.0.1:3000/api/health'
          wait-on-timeout: 30
          browser: electron

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore